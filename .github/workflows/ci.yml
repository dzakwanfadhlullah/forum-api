name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Test Environment File
        run: |
          cat <<EOF > .test.env
          NODE_ENV=test
          PORT=5000
          PGHOST=localhost
          PGPORT=5432
          PGUSER=developer
          PGPASSWORD=supersecretpassword
          PGDATABASE=forumapi_test
          ACCESS_TOKEN_KEY=test_access_token_key_secret_1234567890
          REFRESH_TOKEN_KEY=test_refresh_token_key_secret_1234567890
          ACCESS_TOKEN_AGE=3000
          EOF

      - name: Run Database Migrations
        run: npm run migrate:test

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Tests with 100% Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: developer
          PGPASSWORD: supersecretpassword
          PGDATABASE: forumapi_test
          ACCESS_TOKEN_KEY: test_access_token_key_secret_1234567890
          REFRESH_TOKEN_KEY: test_refresh_token_key_secret_1234567890
          ACCESS_TOKEN_AGE: 3000
