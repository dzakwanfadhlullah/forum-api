# Rate limiting configuration: 90 requests per minute pada $binary_remote_addr
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;
limit_req_status 429;

# HTTP Server - Redirect seluruh trafik HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect ke HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server - SSL/TLS & Reverse Proxy Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Settings
    ssl_certificate /etc/letsencrypt/live/forum-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum-api/privkey.pem;

    # Modern SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Menerapkan Limit Access (Rate Limiting) pada endpoint /threads beserta seluruh turunannya:
    # - POST   /threads
    # - GET    /threads/:id
    # - POST   /threads/:id/comments
    # - DELETE /threads/:id/comments/:commentId
    # - POST   /threads/:id/comments/:commentId/replies
    # - DELETE /threads/:id/comments/:commentId/replies/:replyId
    # - PUT    /threads/:id/comments/:commentId/likes
    location /threads {
        limit_req zone=threads_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Endpoint umum lainnya (/users, /authentications, root, healthcheck)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
